[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firerisk-open"
version = "0.1.0"
description = "Experimental next-day satellite fire detection predictions with NASA FIRMS and weather"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3","pandas>=2.0,<3","scikit-learn>=1.3,<2","requests>=2.31,<3","joblib>=1.3,<2","fastapi>=0.100,<1","uvicorn>=0.23,<1"]

[tool.setuptools.packages.find]
include = ["fireaq*"]
